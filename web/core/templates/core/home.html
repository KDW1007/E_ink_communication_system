<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visible Memory</title>
  <style>
    :root {
      --bg: #f2f0eb;
      --ink: #1a1a1a;
      --muted: #5c5c5c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Pretendard", "Apple SD Gothic Neo", sans-serif;
      background:
        radial-gradient(ellipse at 20% 10%, #e8e4d9 0%, transparent 50%),
        radial-gradient(ellipse at 80% 90%, #ddd8cc 0%, transparent 45%),
        var(--bg);
      color: var(--ink);
    }
    main {
      text-align: center;
      padding: 2rem;
    }
    h1 {
      margin: 0 0 0.5rem;
      font-size: clamp(2rem, 6vw, 3.25rem);
      font-weight: 700;
      letter-spacing: -0.03em;
    }
    p {
      margin: 0;
      color: var(--muted);
      font-size: 1.05rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>Visible Memory</h1>
    <p>Django 기본 사이트</p>
  </main>
</body>
</html>
